pages_build_output_dir = "./dist"

# ==============================================================================
# CRITICAL SECURITY POLICY — DO NOT EDIT WITHOUT READING:
# NEVER PUT SECRETS OR PRIVATE TOKENS IN THIS FILE!
#
# DO NOT add REVALIDATE_SECRET, CF_API_TOKEN, CLOUDFLARE_ZONE_ID, or any other
# sensitive credentials to this [vars] section or anywhere in wrangler.toml!
